[package]
name = "stableprop"
version = "0.6.0-dev"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Propagate uncertainty through neural networks analytically"
repository = "https://github.com/arclabs561/stableprop"
homepage = "https://github.com/arclabs561/stableprop"
documentation = "https://docs.rs/stableprop"
readme = "README.md"
keywords = ["uncertainty", "moment-propagation", "neural-network", "gaussian", "calibration"]
categories = ["science", "algorithms"]
publish = true

[workspace]

[features]
default = []
# Burn-tensor backend: differentiable, batched moment propagation (Rust 1.95+).
burn = ["dep:burn"]
# WGPU Metal backend with operation fusion (macOS, f32).
metal = ["burn", "burn/metal", "burn/fusion"]

[dependencies]
burn = { git = "https://github.com/tracel-ai/burn", rev = "1414c8a14e5169ef5e5fc67f9b8ab01a25d6352d", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# autodiff is needed by the cora_uncertainty example's training loop; cargo
# unifies this with the optional `burn` dep when building stableprop's examples.
burn = { git = "https://github.com/tracel-ai/burn", rev = "1414c8a14e5169ef5e5fc67f9b8ab01a25d6352d", default-features = false, features = ["std", "autodiff", "optim", "flex", "linalg"] }
ricci = { git = "https://github.com/arclabs561/ricci", rev = "0cb0e88439e15420bbba14086ceea459b46d3527" }
statskit = "0.3.0"
tuplet = { git = "https://github.com/arclabs561/tuplet", rev = "dc4f68d4ea78a938b1c0254f0121cbaf80aa7a2a", features = ["burn-flex"] }
proptest = "1.5"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "reference"
harness = false

[[bench]]
name = "burn"
harness = false
required-features = ["burn"]

[[example]]
name = "gcn_uncertainty"
required-features = ["burn"]

[[example]]
name = "cora_uncertainty"
required-features = ["burn"]

[[example]]
name = "regression_intervals"
required-features = ["burn"]

[[example]]
name = "conformal_intervals"
required-features = ["burn"]

[[example]]
name = "grouped_intervals"
required-features = ["burn"]

[[example]]
name = "kalman_sensor_intervals"
required-features = ["burn"]

[[example]]
name = "robust_training"
required-features = ["burn"]

[[example]]
name = "robust_selection"
required-features = ["burn"]

[[example]]
name = "full_covariance"
required-features = ["burn"]

[[example]]
name = "misclassification_risk"
required-features = ["burn"]

[package.metadata.docs.rs]
features = ["burn"]

[[example]]
name = "cauchy_tails"
required-features = ["burn"]

[[example]]
name = "tuplet_contrastive"
required-features = ["burn"]

[[example]]
name = "pairwise_ranking_risk"
required-features = ["burn"]

[[example]]
name = "uncertainty_sources"
required-features = ["burn"]

[[example]]
name = "active_selection"
required-features = ["burn"]

[[example]]
name = "correlated_residual"
required-features = ["burn"]
